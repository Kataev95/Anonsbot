<!doctype html><html lang="ru"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;color:white;font-family:system-ui,sans-serif;background:#100f2c}
.scene{position:relative;overflow:hidden;min-height:365px;padding:18px 11px 12px;text-align:center;background:linear-gradient(145deg,#2e1255,#131638 58%,#103a43)}
.badge{display:inline-block;font-size:10px;font-weight:800;letter-spacing:2px;border:1px solid #75efd3;border-radius:30px;padding:6px 12px;color:#8fffea}
h1{font-size:30px;font-weight:900;color:#ffd777;margin:13px 0 4px}
.sub{font-size:12px;color:#d6cbea;margin:0 0 20px}
.clock{display:flex;justify-content:center;gap:5px}
.unit{flex:1;max-width:80px;padding:10px 2px 8px;border-radius:11px;background:#ffffff18;border:1px solid #ffffff38}
.value{font-size:25px;line-height:1.2;font-weight:800;font-variant-numeric:tabular-nums}
.label{font-size:9px;letter-spacing:.4px;color:#adbbdc;margin-top:4px}
.world{position:relative;margin:20px -11px 0;height:120px;overflow:hidden;background:linear-gradient(#173352,#23494a)}
.moon{position:absolute;width:33px;height:33px;border-radius:50%;background:#ffdda0;right:24px;top:10px;box-shadow:0 0 22px #ffc77f}
.hill{position:absolute;bottom:-32px;left:-10%;width:125%;height:70px;border-radius:50%;background:#1d5a50}
.ground{position:absolute;bottom:0;width:100%;height:21px;background:#0c292e;border-top:2px solid #3b8066}
.pet{position:absolute;bottom:21px;left:0;font-size:34px;will-change:transform}
.p2{font-size:29px}.p3{font-size:30px}.p4{font-size:27px}
.foot{font-size:12px;color:#bde8d9;margin-top:13px}.stars{color:#ffda78;font-size:16px;letter-spacing:8px;margin-top:5px}
</style></head><body><main class="scene">
<div class="badge">СКОРО В ЧАТЕ</div><h1>🍬 IRISKA 3.0</h1>
<p class="sub">Большое обновление уже близко!</p>
<div class="clock">
<div class="unit"><div class="value" id="d">10</div><div class="label">ДНЕЙ</div></div>
<div class="unit"><div class="value" id="h">00</div><div class="label">ЧАСОВ</div></div>
<div class="unit"><div class="value" id="m">00</div><div class="label">МИНУТ</div></div>
<div class="unit"><div class="value" id="s">00</div><div class="label">СЕКУНД</div></div>
</div>
<div class="world"><div class="moon"></div><div class="hill"></div><div class="ground"></div>
<div class="pet p1"><span>🐱</span></div><div class="pet p2"><span>🦊</span></div>
<div class="pet p3"><span>🐰</span></div><div class="pet p4"><span>🐲</span></div></div>
<div class="foot" id="status">🐾 Питомцы готовятся к возвращению</div>
<div class="stars">✦ ✦ ✦</div>
</main><script>
(function(){var target=__TARGET_MS__;function tick(){var t=Math.max(0,Math.ceil((target-Date.now())/1000));document.getElementById('d').textContent=String(Math.floor(t/86400));document.getElementById('h').textContent=String(Math.floor(t%86400/3600)).padStart(2,'0');document.getElementById('m').textContent=String(Math.floor(t%3600/60)).padStart(2,'0');document.getElementById('s').textContent=String(t%60).padStart(2,'0');if(!t)document.getElementById('status').textContent='🎉 Время обновления наступило!'}tick();setInterval(tick,1000);
// Двигаем животных через JS, а не CSS keyframes: надёжнее в Telegram Widget Runtime.
var arena=document.querySelector('.world'),pets=document.querySelectorAll('.pet');
var speeds=[83,57,101,69],offsets=[0,110,235,320];
var lastFrame=0;
function animate(now){
  // Визуал обновляем не чаще 30 FPS, сохраняя плавность.
  if(now-lastFrame>33){
    lastFrame=now;
    var width=arena.clientWidth||340,cycle=width+85;
    var sec=Date.now()/1000;
    for(var i=0;i<pets.length;i++){
      var x=((sec*speeds[i]+offsets[i])%cycle)-55;
      var y=-Math.abs(Math.sin(sec*8+i*2))*9;
      pets[i].style.transform='translate('+Math.round(x)+'px,'+Math.round(y)+'px)';
    }
  }
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
if(window.TelegramWidget)TelegramWidget.ready()})();
</script></body></html>
